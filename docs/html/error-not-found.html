<body class="bg-stone-50 min-h-screen flex flex-col">

      <button

          src="https://i.pravatar.cc/80?img=13"
          alt="Taro Yamada"
          class="w-full h-full object-cover"
        />

    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 px-4 py-8">

        <h1 class="font-logo text-xs tracking-wider text-stone-400 uppercase border-b border-stone-200 pb-2">Not Found</h1>

        <p class="text-sm text-stone-600 leading-relaxed">

        </p>

      <div class="mt-6 flex justify-end">

            <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M3 12l9-9 9 9M5 10v10h4v-6h6v6h4V10"/>
          </svg>
          <span class="font-logo text-xs tracking-widest uppercase">Back to home</span>
        </a>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <footer class="py-6 border-t border-stone-200 bg-white">
    <p class="text-center font-logo text-xs tracking-widest text-stone-400 uppercase">tocoop</p>
  </footer>

</body>
