<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tocoop - Home (Authenticated)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#f4f7ed",
                100: "#e6edda",
                200: "#cedbb8",
                300: "#afc48d",
                400: "#93ad6a",
                500: "#7a9650",
                600: "#5e763d",
                700: "#4a5c33",
                800: "#3d4b2d",
                900: "#354029",
              },
              secondary: {
                50: "#faf8ed",
                100: "#f3efd3",
                200: "#e8dfa8",
                300: "#d9c974",
                400: "#ccb54c",
                500: "#bda03e",
                600: "#a37e33",
                700: "#835e2c",
                800: "#6d4d2b",
                900: "#5e4128",
              },
            },
            fontFamily: {
              logo: ['"DM Mono"', "monospace"],
              body: ['"Inter"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-stone-50 min-h-screen flex flex-col">
    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4">
      <div class="w-full max-w-sm">
        <!-- Logo & Title -->
        <div class="text-center mb-10">
          <div class="inline-block mb-4">
            <div class="border-2 border-primary-700 px-5 py-2">
              <h1 class="font-logo font-medium text-4xl tracking-widest text-primary-800 uppercase">
                tocoop
              </h1>
            </div>
            <div class="border-b-2 border-l-2 border-r-2 border-primary-700 px-3 py-1">
              <p class="font-logo text-xs tracking-wider text-primary-600">
                COST PER MONTH TRACKER
              </p>
            </div>
          </div>
          <p class="text-sm text-stone-500 leading-relaxed mt-4">
            Track the real cost of your purchases.<br />
            See how value grows over time.
          </p>
        </div>

        <!-- User Profile Card -->
        <div class="border border-stone-200 bg-white p-6">
          <h2
            class="font-logo text-xs tracking-wider text-stone-400 uppercase mb-6 text-center border-b border-stone-100 pb-3"
          >
            Account
          </h2>

          <!-- Profile Image -->
          <div class="flex justify-center mb-5">
            <div
              class="w-20 h-20 rounded-full bg-primary-100 border-2 border-primary-300 flex items-center justify-center overflow-hidden"
            >
              <svg class="w-10 h-10 text-primary-500" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                />
              </svg>
            </div>
          </div>

          <!-- User Info -->
          <div class="space-y-3">
            <div class="border border-stone-100 px-4 py-3">
              <p class="text-xs font-medium text-stone-400 uppercase tracking-wide mb-1">
                Display Name
              </p>
              <p class="text-sm text-stone-800 font-medium">Taro Yamada</p>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="mt-6 pt-4 border-t border-stone-100 space-y-3">
            <a
              href="#"
              class="flex items-center justify-center gap-2 w-full bg-primary-600 hover:bg-primary-700 text-white py-2.5 transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="square"
                  stroke-linejoin="miter"
                  stroke-width="2"
                  d="M12 8v13m0-13V6a2 2 0 112-2h.88a2 2 0 011.41 3.41L12 8m0 0H7.12a2 2 0 01-1.41-3.41A2 2 0 017.12 4H8a2 2 0 012 2v2m-6 4h16M6 20h12a2 2 0 002-2v-6H4v6a2 2 0 002 2z"
                />
              </svg>
              <span class="font-logo text-xs tracking-widest uppercase">Items</span>
            </a>
            <button
              type="button"
              class="flex items-center justify-center gap-2 w-full border border-stone-300 hover:border-stone-400 py-2.5 text-stone-600 hover:text-stone-700 transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="square"
                  stroke-linejoin="miter"
                  stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                />
              </svg>
              <span class="font-logo text-xs tracking-widest uppercase">Sign Out</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Global Footer -->
    <footer class="py-6 border-t border-stone-200">
      <p class="text-center font-logo text-xs tracking-widest text-stone-400 uppercase">tocoop</p>
    </footer>
  </body>
</html>
