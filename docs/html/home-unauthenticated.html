<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tocoop - Home (Unauthenticated)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f4f7ed',
              100: '#e6edda',
              200: '#cedbb8',
              300: '#afc48d',
              400: '#93ad6a',
              500: '#7a9650',
              600: '#5e763d',
              700: '#4a5c33',
              800: '#3d4b2d',
              900: '#354029',
            },
            secondary: {
              50: '#faf8ed',
              100: '#f3efd3',
              200: '#e8dfa8',
              300: '#d9c974',
              400: '#ccb54c',
              500: '#bda03e',
              600: '#a37e33',
              700: '#835e2c',
              800: '#6d4d2b',
              900: '#5e4128',
            },
          },
          fontFamily: {
            logo: ['"DM Mono"', 'monospace'],
            body: ['"Inter"', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-stone-50 min-h-screen flex flex-col">

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center px-4">
    <div class="w-full max-w-sm">

      <!-- Logo & Title -->
      <div class="text-center mb-10">
        <div class="inline-block mb-4">
          <div class="border-2 border-primary-700 px-5 py-2">
            <h1 class="font-logo font-medium text-4xl tracking-widest text-primary-800 uppercase">tocoop</h1>
          </div>
          <div class="border-b-2 border-l-2 border-r-2 border-primary-700 px-3 py-1">
            <p class="font-logo text-xs tracking-wider text-primary-600">COST PER MONTH TRACKER</p>
          </div>
        </div>
        <p class="text-sm text-stone-500 leading-relaxed mt-4">
          Track the real cost of your purchases.<br>
          See how value grows over time.
        </p>
      </div>

      <!-- Login -->
      <div class="border border-stone-200 bg-white p-6">
        <h2 class="font-logo text-xs tracking-wider text-stone-400 uppercase mb-6 text-center border-b border-stone-100 pb-3">Sign In</h2>

        <button
          type="button"
          class="w-full border border-stone-300 hover:border-primary-400 py-2.5 text-sm font-medium text-stone-600 hover:text-primary-700 tracking-wide transition-colors flex items-center justify-center gap-2"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Sign in with Google
        </button>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <footer class="py-6 border-t border-stone-200">
    <p class="text-center font-logo text-xs tracking-widest text-stone-400 uppercase">tocoop</p>
  </footer>

</body>
</html>
