<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tocoop - Item Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f4f7ed',
              100: '#e6edda',
              200: '#cedbb8',
              300: '#afc48d',
              400: '#93ad6a',
              500: '#7a9650',
              600: '#5e763d',
              700: '#4a5c33',
              800: '#3d4b2d',
              900: '#354029',
            },
            secondary: {
              50: '#faf8ed',
              100: '#f3efd3',
              200: '#e8dfa8',
              300: '#d9c974',
              400: '#ccb54c',
              500: '#bda03e',
              600: '#a37e33',
              700: '#835e2c',
              800: '#6d4d2b',
              900: '#5e4128',
            },
          },
          fontFamily: {
            logo: ['"DM Mono"', 'monospace'],
            body: ['"Inter"', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      min-width: 360px;
    }
  </style>
</head>
<body class="bg-stone-50 min-h-screen flex flex-col">

  <!-- Global Header -->
  <header class="border-b border-stone-200 bg-white">
    <div class="max-w-sm mx-auto px-4 py-3 flex items-center justify-between">
      <div class="border border-primary-700 px-3 py-1">
        <span class="font-logo font-medium text-base tracking-widest text-primary-800 uppercase">tocoop</span>
      </div>
      <button
        type="button"
        aria-label="Open navigation menu"
        class="w-9 h-9 rounded-full overflow-hidden border border-stone-200 hover:border-primary-400 transition-colors"
      >
        <img
          src="https://i.pravatar.cc/80?img=13"
          alt="Taro Yamada"
          class="w-full h-full object-cover"
        />
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 px-4 py-8">
    <div class="w-full max-w-sm mx-auto">

      <!-- Page Header -->
      <div class="mb-6">
        <h1 class="font-logo text-xs tracking-wider text-stone-400 uppercase border-b border-stone-200 pb-2">Item Detail</h1>
      </div>

      <!-- Item Name -->
      <div class="bg-white border-t border-b border-stone-200 px-4 py-4">
        <p class="font-logo text-xs tracking-wider text-stone-400 uppercase mb-1">Name</p>
        <p class="text-base text-stone-800 font-medium">エアコン</p>
      </div>

      <!-- Item Attributes -->
      <dl class="mt-6 bg-white border-t border-b border-stone-200 divide-y divide-stone-100">
        <div class="flex items-baseline justify-between px-4 py-4">
          <dt class="font-logo text-xs tracking-wider text-stone-400 uppercase">Purchase Price</dt>
          <dd class="font-logo text-sm text-stone-800 tracking-wider">¥100,000</dd>
        </div>
        <div class="flex items-baseline justify-between px-4 py-4">
          <dt class="font-logo text-xs tracking-wider text-stone-400 uppercase">Purchase Date</dt>
          <dd class="font-logo text-sm text-stone-800 tracking-wider">2026.03</dd>
        </div>
      </dl>

      <!-- Cost per Month (highlighted) -->
      <div class="mt-6 border-2 border-primary-700 bg-primary-50 px-4 py-5">
        <p class="font-logo text-xs tracking-wider text-primary-700 uppercase mb-2 text-center">Cost per Month</p>
        <p class="font-logo text-3xl text-primary-800 tracking-wider text-center">¥50,000</p>
        <p class="font-logo text-xs tracking-wider text-primary-600 uppercase mt-2 text-center">2026.04 / Month 2</p>
      </div>

      <!-- Edit Button -->
      <div class="mt-6 flex justify-end">
        <button
          type="button"
          class="inline-flex items-center gap-2 border border-primary-700 bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 transition-colors"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
          <span class="font-logo text-xs tracking-widest uppercase">Edit</span>
        </button>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <footer class="py-6 border-t border-stone-200 bg-white">
    <p class="text-center font-logo text-xs tracking-widest text-stone-400 uppercase">tocoop</p>
  </footer>

</body>
</html>
