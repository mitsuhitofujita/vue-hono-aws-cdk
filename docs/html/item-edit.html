<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tocoop - Item Edit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f4f7ed',
              100: '#e6edda',
              200: '#cedbb8',
              300: '#afc48d',
              400: '#93ad6a',
              500: '#7a9650',
              600: '#5e763d',
              700: '#4a5c33',
              800: '#3d4b2d',
              900: '#354029',
            },
            secondary: {
              50: '#faf8ed',
              100: '#f3efd3',
              200: '#e8dfa8',
              300: '#d9c974',
              400: '#ccb54c',
              500: '#bda03e',
              600: '#a37e33',
              700: '#835e2c',
              800: '#6d4d2b',
              900: '#5e4128',
            },
          },
          fontFamily: {
            logo: ['"DM Mono"', 'monospace'],
            body: ['"Inter"', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      min-width: 360px;
    }
    /* Remove default browser styling for inputs to keep the rigid look */
    input[type="text"],
    input[type="number"],
    input[type="month"] {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="bg-stone-50 min-h-screen flex flex-col">

  <!-- Global Header -->
  <header class="border-b border-stone-200 bg-white">
    <div class="max-w-sm mx-auto px-4 py-3 flex items-center justify-between">
      <div class="border border-primary-700 px-3 py-1">
        <span class="font-logo font-medium text-base tracking-widest text-primary-800 uppercase">tocoop</span>
      </div>
      <button
        type="button"
        aria-label="Open navigation menu"
        class="w-9 h-9 rounded-full overflow-hidden border border-stone-200 hover:border-primary-400 transition-colors"
      >
        <img
          src="https://i.pravatar.cc/80?img=13"
          alt="Taro Yamada"
          class="w-full h-full object-cover"
        />
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 px-4 py-8">
    <div class="w-full max-w-sm mx-auto">

      <!-- Page Header -->
      <div class="mb-6">
        <h1 class="font-logo text-xs tracking-wider text-stone-400 uppercase border-b border-stone-200 pb-2">Item Edit</h1>
      </div>

      <!-- Form -->
      <form>

        <!-- Item Name -->
        <div class="bg-white border-t border-b border-stone-200 px-4 py-4">
          <label for="item-name" class="block font-logo text-xs tracking-wider text-stone-400 uppercase mb-2">Name</label>
          <input
            id="item-name"
            type="text"
            value="エアコン"
            placeholder="エアコン"
            class="w-full bg-transparent border-0 border-b border-stone-200 focus:border-primary-600 focus:outline-none text-base text-stone-800 font-medium py-1 placeholder:text-stone-300"
          />
        </div>

        <!-- Purchase Price -->
        <div class="mt-6 bg-white border-t border-b border-stone-200 px-4 py-4">
          <label for="purchase-price" class="block font-logo text-xs tracking-wider text-stone-400 uppercase mb-2">Purchase Price</label>
          <div class="flex items-baseline gap-2">
            <span class="font-logo text-base text-stone-500">¥</span>
            <input
              id="purchase-price"
              type="number"
              inputmode="numeric"
              min="0"
              step="1"
              value="100000"
              placeholder="100000"
              class="flex-1 bg-transparent border-0 border-b border-stone-200 focus:border-primary-600 focus:outline-none font-logo text-base text-stone-800 tracking-wider py-1 placeholder:text-stone-300 text-right"
            />
          </div>
        </div>

        <!-- Purchase Date -->
        <div class="mt-6 bg-white border-t border-b border-stone-200 px-4 py-4">
          <label for="purchase-date" class="block font-logo text-xs tracking-wider text-stone-400 uppercase mb-2">Purchase Date</label>
          <input
            id="purchase-date"
            type="month"
            value="2026-03"
            class="w-full bg-transparent border-0 border-b border-stone-200 focus:border-primary-600 focus:outline-none font-logo text-base text-stone-800 tracking-wider py-1"
          />
        </div>

        <!-- Disposal Date -->
        <div class="mt-6 bg-white border-t border-b border-stone-200 px-4 py-4">
          <label for="disposal-date" class="block font-logo text-xs tracking-wider text-stone-400 uppercase mb-2">Disposal Date</label>
          <input
            id="disposal-date"
            type="month"
            value=""
            class="w-full bg-transparent border-0 border-b border-stone-200 focus:border-primary-600 focus:outline-none font-logo text-base text-stone-800 tracking-wider py-1"
          />
        </div>

        <!-- Apply Button -->
        <div class="mt-8 flex justify-end">
          <button
            type="submit"
            class="inline-flex items-center gap-2 border border-primary-700 bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 transition-colors"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span class="font-logo text-xs tracking-widest uppercase">Apply</span>
          </button>
        </div>

      </form>

      <!-- Danger Zone (Delete) -->
      <div class="mt-12 pt-6 border-t border-stone-200">
        <p class="font-logo text-xs tracking-wider text-stone-400 uppercase mb-3">Danger Zone</p>
        <div class="flex justify-end">
          <button
            type="button"
            class="inline-flex items-center gap-2 border border-red-700 bg-white hover:bg-red-50 text-red-700 px-4 py-2 transition-colors"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/>
            </svg>
            <span class="font-logo text-xs tracking-widest uppercase">Delete</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <footer class="py-6 border-t border-stone-200 bg-white">
    <p class="text-center font-logo text-xs tracking-widest text-stone-400 uppercase">tocoop</p>
  </footer>

</body>
</html>
